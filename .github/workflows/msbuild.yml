name: MSBuild

on:
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions/setup-python@v7
      id: cpy
      with:
        python-version: '3.14'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Install vcpkg
      run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          ./vcpkg integrate install

    - name: Set vcpkg environment variables
      run: |
        echo "VCPKG_ROOT=${{ env.GITHUB_WORKSPACE }}\vcpkg" >> $GITHUB_ENV
        echo "PATH=${{ env.GITHUB_WORKSPACE }}\vcpkg;%PATH%" >> $GITHUB_ENV

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      env:
        # setup-python installs into the tool cache, not C:\Python3XY, so point
        # python.props straight at that root via the override env var.
        SPLITGATE_PYTHON_DIR: ${{ env.pythonLocation }}
      run: Tools/build.bat

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Release
        path: ${{env.SOLUTION_FILE_PATH}}/x64/Release
        if-no-files-found: warn
